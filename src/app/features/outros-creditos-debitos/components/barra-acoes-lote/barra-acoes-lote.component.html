<div class="flex flex-wrap gap-2 mb-4 p-3 bg-gray-50 border border-gray-200 rounded">
  <p-button label="Confirmar" (onClick)="confirmar.emit()" severity="success" />
  <p-button label="Enviar" (onClick)="enviar.emit()" />
  <p-button label="Visualizar Justificativa" (onClick)="visualizarJustificativa.emit()" severity="secondary" />
  <p-button label="Incluir" (onClick)="incluir.emit()" [disabled]="!podeIncluir" />
  <p-button label="Alterar" (onClick)="alterar.emit()" [disabled]="!podeAlterar" />
  <p-button label="Excluir" (onClick)="excluir.emit()" severity="danger" [disabled]="!podeExcluir" />
  <p-button label="Visualizar" (onClick)="visualizar.emit()" severity="secondary" [disabled]="!podeVisualizar" />
</div>
