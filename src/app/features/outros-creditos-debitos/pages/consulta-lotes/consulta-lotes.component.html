<header class="bg-white border-b border-gray-200 p-4 md:p-6">
  <h1 class="text-xl font-semibold text-gray-900">Outros Créditos/Débitos</h1>
  <nav class="text-sm text-gray-500">Início &gt; Outros Créditos/Débitos</nav>
</header>

<div class="m-4 md:m-6 bg-white rounded-lg shadow p-6">
  <app-filtro-lotes (pesquisar)="onPesquisar($event)" />

  <app-barra-acoes-lote
    [podeIncluir]="umLoteSelecionado()"
    [podeAlterar]="umLoteSelecionado()"
    [podeExcluir]="umLoteSelecionado()"
    [podeVisualizar]="umLoteSelecionado()"
    (incluir)="onIncluir()"
    (alterar)="onAlterar()"
    (excluir)="onExcluir()"
    (visualizar)="onVisualizar()"
    (confirmar)="onConfirmar()"
    (enviar)="onEnviar()"
    (visualizarJustificativa)="onVisualizarJustificativa()"
  />

  <app-data-table
    id="tabela-lotes"
    [data]="lotes()"
    [rows]="paginacaoAtual.rows"
    [first]="paginacaoAtual.first"
    [columns]="columns"
    dataKey="idLote"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [selection]="selecionados()"
    (selectionChange)="onSelectionChange($event)"
    (pageChange)="onPageChange($event)"
  />
</div>

@if (loteSelecionadoParaIncluir(); as idLote) {
  <app-incluir-lancamento
    [visible]="modalVisivel()"
    [idLote]="idLote"
    (visibleChange)="modalVisivel.set($event)"
    (lancamentoConfirmado)="onLancamentoConfirmado($event)"
  />
}
